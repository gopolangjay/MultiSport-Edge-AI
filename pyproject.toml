[project]
name = "multisport-edge-ai"
version = "0.1.0"
description = "Auditable multi-sport prediction and portfolio analysis API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "mcp>=2,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<6", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["android*", "tests*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
