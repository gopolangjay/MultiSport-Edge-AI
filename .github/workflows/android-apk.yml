name: Build Android APK

on:
  push:
    branches: [main, repair/android-production-api]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  pull_request:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Verify private Android connection contract
        working-directory: .
        run: |
          python - <<'PY'
          from pathlib import Path
          code = Path('android/app/src/main/java/za/co/multisportedge/MainActivity.java').read_text()
          assert 'webView.loadUrl(APP_ORIGIN + "/")' in code
          assert 'addJavascriptInterface' not in code
          assert 'setAllowFileAccess(false)' in code
          assert 'setAcceptThirdPartyCookies(webView, false)' in code
          print('HTTPS owner-session UI; no anonymous API bridge or bundled credentials')
          PY
      - name: Build installable signed debug APK
        run: gradle clean assembleDebug --no-daemon
      - name: Locate Android build tools
        run: echo "BUILD_TOOLS=$(ls -d $ANDROID_HOME/build-tools/* | sort -V | tail -1)" >> $GITHUB_ENV
      - name: Validate APK
        run: |
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          "$BUILD_TOOLS/apksigner" verify --verbose --print-certs "$APK"
          "$BUILD_TOOLS/aapt" dump badging "$APK" | tee /tmp/badging.txt
          grep -q "package: name='za.co.multisportedge'" /tmp/badging.txt
          grep -q "sdkVersion:'24'" /tmp/badging.txt
          sha256sum "$APK" | tee app/build/outputs/apk/debug/app-debug.apk.sha256
          unzip -t "$APK"
      - uses: actions/upload-artifact@v4
        with:
          name: MultiSport-Edge-AI-Android-Private
          path: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error
